<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>DOM Practice</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>DOM LAB</h1>
    </header>

    <main class="main-content">

        <div class="row">

            <!-- Form -->
            <div class="col col-lg-6">
                <section class="card">
                    <h2>Signup Form</h2>

                    <form id="signupForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input id="username" placeholder="Enter username" type="text">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" placeholder="Enter password" type="password">
                        </div>

                        <button class="btn btn-success" type="submit">Submit</button>
                    </form>

                    <div class="message" id="formMessage"></div>
                </section>
            </div>

            <!-- Calculator -->
            <div class="col col-lg-6">
                <section class="card">
                    <h2>Calculator</h2>

                    <div class="calculator">
                        <input id="calcDisplay" readonly value="0">

                        <div class="calc-buttons">
                            <button data-action="clear">C</button>
                            <button data-action="backspace">⌫</button>
                            <button data-operator="/">÷</button>
                            <button data-operator="*">×</button>

                            <button data-number="7">7</button>
                            <button data-number="8">8</button>
                            <button data-number="9">9</button>
                            <button data-operator="-">−</button>

                            <button data-number="4">4</button>
                            <button data-number="5">5</button>
                            <button data-number="6">6</button>
                            <button data-operator="+">+</button>

                            <button data-number="1">1</button>
                            <button data-number="2">2</button>
                            <button data-number="3">3</button>
                            <button class="tall" data-action="equals">=</button>

                            <button class="wide" data-number="0">0</button>
                            <button data-number=".">.</button>
                        </div>
                    </div>
                </section>
            </div>

        </div>

        <!-- Table Generator -->
        <section class="card">
            <h2>Dynamic Table Generator</h2>

            <div class="controls">
                <input id="rows" max="50" min="1" placeholder="Rows" type="number">
                <input id="cols" max="20" min="1" placeholder="Columns" type="number">
                <button class="btn btn-primary" id="createTable">Create Table</button>
            </div>

            <div id="tableContainer"></div>
        </section>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
